<!DOCTYPE html>
<html>
<head>
    <title>Register | SpotHunt</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+Chettan+2:wght@400..800&display=swap"
        rel="stylesheet"
    />
    <style>
        .auth-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
            background: var(--background-color);
        }

        .auth-box {
            background: var(--background-alt-color);
            padding: 40px;
            border-radius: 24px;
            box-shadow: rgba(0, 0, 0, 0.25) 0px 10px 15px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .auth-box h2 {
            margin-bottom: 24px;
            color: var(--secondary-color);
            font-size: 32px;
        }

        .auth-box input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 16px;
            border: 2px solid var(--primary-color);
            border-radius: 9999px;
            font-size: 18px;
            outline: none;
        }

        .auth-box button {
            width: 100%;
            font-size: 20px;
        }

        .auth-box p {
            margin-top: 16px;
            color: var(--on-background-faded-color);
        }

        .auth-box a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .auth-box a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h2>Register</h2>
            {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
            <form method="POST">
                <input name="username" placeholder="Username" required>
                <input name="password" type="password" placeholder="Password" required>
                <button type="submit" class="primary-button">Register</button>
            </form>
            <p>Ai cont? <a href="/">Login</a></p>
        </div>
    </div>
</body>
</html>
