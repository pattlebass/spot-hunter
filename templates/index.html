<!DOCTYPE html>
<html>
	<head>
		<title>Craiova Explorer</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="/static/css/leaflet.css" crossorigin="" />
		<style>
			body {
				margin: 0;
				display: flex;
				height: 100vh;
				font-family: Arial, sans-serif;
			}
			#sidebar {
				width: 250px;
				background: #f4f4f4;
				padding: 10px;
				overflow: auto;
			}
			#map {
				flex: 1;
			}
			.waypoint {
				cursor: pointer;
				padding: 5px;
				border-bottom: 1px solid #ddd;
			}
			.waypoint:hover {
				background: #e0e0e0;
			}

			.chatBox {
				position: absolute;
				top: 50px;
				left: 50px;
				width: 350px;
				height: 400px;
				background: white;
				border: 2px solid #333;
				z-index: 1000;
				display: flex;
				flex-direction: column;
			}
			.chatHeader {
				background: #333;
				color: white;
				padding: 5px;
				cursor: move;
			}
			.chatContent {
				flex: 1;
				overflow-y: auto;
				padding: 5px;
			}
			.chatInput {
				display: flex;
			}
			.chatInput input {
				flex: 1;
				padding: 5px;
			}
			.chatInput button {
				padding: 5px;
			}
			#score {
				margin-top: 10px;
				font-weight: bold;
			}
		</style>
	</head>
	<body>
		<!-- <div id="sidebar">
			<h3>Locatii culturale</h3>
			<div id="waypoints-list"></div>
			<div id="score">Acoperire: 0%</div>
		</div> -->
		<div id="map"></div>

		<script src="/static/js/socket.io.min.js"></script>
		<script src="/static/js/leaflet.js" crossorigin=""></script>
		<script>
			const socket = io();
			const culturalLocations = {{ cultural_locations | safe }};
			const visitedPoints = [];
			// const listDiv = document.getElementById('waypoints-list');
			// const scoreDiv = document.getElementById('score');
			const username = "{{ session['username'] }}";

			const craiovaBounds = L.latLngBounds([44.35745809206229, 23.733475785989047],[44.277779832389044, 23.86410630191919]);

			function initMap(lat, lon){
			    const map = L.map('map', {zoomControl: false, maxBounds:craiovaBounds, maxBoundsViscosity:0.5}).setView([lat, lon], 14);

			    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {minZoom:13, attribution:'&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);

			    const userMarker = L.marker([lat, lon]).addTo(map).bindPopup("Tu ești aici!").openPopup();

			    // Waypoints + cultural locations
			    culturalLocations.forEach(loc=>{
			        const marker = L.marker([loc.lat, loc.lon]).addTo(map).bindPopup(`<b>${loc.name}</b>`);
			        /*const div = document.createElement('div');
			        div.className='waypoint';
			        div.innerText=loc.name;
			        div.onclick=()=>{map.setView([loc.lat, loc.lon],15); openChat(loc.name);};
			        listDiv.appendChild(div);*/

			        marker.on('click', ()=>{
			            openChat(loc.name);
			            // dacă e aproape de utilizator, marcam vizitat
			            const dist = map.distance([lat, lon], [loc.lat, loc.lon]);
			            if(dist < 50){ // aprox 50 metri
			                if(!visitedPoints.includes(loc.name)){
			                    visitedPoints.push(loc.name);
			                    updateScore();
			                }
			            }
			        });
			    });

			    // Opțiune click pe locatia curenta
			    const currDiv = document.createElement('div');
			    currDiv.className='waypoint';
			    currDiv.innerText='Locatia curenta';
			    currDiv.onclick=()=>{map.setView([lat, lon],15);};
			    // listDiv.appendChild(currDiv);
			}

			function updateScore(){
			    const pct = Math.round((visitedPoints.length / culturalLocations.length)*100);
			    scoreDiv.innerText=`Acoperire: ${pct}%`;
			}

			function openChat(locationName){
			    if(document.getElementById(`chat-${locationName}`)) return;
			    const chatBox = document.createElement('div');
			    chatBox.className='chatBox';
			    chatBox.id=`chat-${locationName}`;
			    chatBox.innerHTML=`
			        <div class="chatHeader">
			            Chat: ${locationName}
			            <span style="float:right; cursor:pointer;" onclick="this.parentElement.parentElement.remove()">X</span>
			        </div>
			        <div class="chatContent" id="chatContent-${locationName}"></div>
			        <div class="chatInput">
			            <input type="text" id="msgInput-${locationName}" placeholder="Scrie mesaj..." />
			            <button onclick="sendMessage('${locationName}')">Trimite</button>
			        </div>
			    `;
			    document.body.appendChild(chatBox);

			    // Load mesaje salvate
			    fetch(`/get_messages/${locationName}`).then(r=>r.json()).then(data=>{
			        const content = document.getElementById(`chatContent-${locationName}`);
			        data.messages.forEach(msg=>{
			            const div=document.createElement('div');
			            div.textContent=msg;
			            content.appendChild(div);
			        });
			        content.scrollTop=content.scrollHeight;
			    });
			}

			function sendMessage(locationName){
			    const input=document.getElementById(`msgInput-${locationName}`);
			    const msg=input.value.trim();
			    if(!msg) return;
			    socket.emit('send_message',{location:locationName,user:username,message:msg});
			    input.value='';
			}

			socket.on('receive_message', data=>{
			    const content=document.getElementById(`chatContent-${data.location}`);
			    if(content){
			        const div=document.createElement('div');
			        div.textContent=data.message;
			        content.appendChild(div);
			        content.scrollTop=content.scrollHeight;
			    }
			});

			if(navigator.geolocation){
			    navigator.geolocation.getCurrentPosition(pos=>{
			        initMap(pos.coords.latitude,pos.coords.longitude);
			    }, ()=>initMap(44.3248,23.798));
			} else {
			    initMap(44.3248,23.798);
			}
		</script>
	</body>
</html>
